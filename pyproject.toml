[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flatjson-cli"
version = "0.1.0"
authors = [
  { name = "Zephyrus Labs", email = "zephyrus.labs@gmail.com" },
]
maintainers = [
  { name = "Shubham Sharma", email = "sharmashubham25962@gmail.com" },
]
description = "Deep JSON & JSONL to Tabular CSV Flattener with schema inspection and streaming"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["json", "jsonl", "csv", "flatten", "data-engineering", "cli", "zephyrus-labs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
flatjson = "flatjson.cli:main"

[project.urls]
"Homepage" = "https://zephyrus-labs.tech/"
"Repository" = "https://github.com/uchiha-fire/flatjson-cli"
"Bug Tracker" = "https://github.com/uchiha-fire/flatjson-cli/issues"
"Documentation" = "https://github.com/uchiha-fire/flatjson-cli#readme"
"LinkedIn" = "https://www.linkedin.com/in/shubham-sharma-28487819b/"

[tool.setuptools.packages.find]
where = ["."]
include = ["flatjson*"]
